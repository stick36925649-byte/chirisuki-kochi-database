<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    /* GIF背景（ファイル名：error.gif） */
    body {
      background: url("error.gif") center / cover no-repeat fixed;
    }

    /* 文字を見やすくする白い幕 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.75);
      z-index: 0;
    }

    .error-wrapper {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 120px auto;
      text-align: center;
      color: #333;
    }

    .error-code {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .error-title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .error-text {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
      margin-bottom: 30px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="error-wrapper">
    <div class="error-code">繧ｨ繝ｩ繝ｼ蝗</div>
    <div class="error-title">繧ｨ繝ｩ繝ｼ蝗帷卆蝗�</div>

    <div class="error-text">
      繧ｨ繝ｩ繝ｼ蝗帷卆蝗�、<br>
      繧ｨ繝ｩ繝ｼ蝗帷卆蝗�。
    </div>

    <a href="Null4.html">繧ｨ繝ｩ繝ｼ蝗帷卆蝗�</a>
  </div>

</body>
</html>
