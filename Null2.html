<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-wrapper {
      max-width: 600px;
      margin: 100px auto;
      text-align: center;
      color: #333;
    }

    .error-code {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .error-title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .error-text {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
      margin-bottom: 30px;
    }

    .error-wrapper a {
      color: #0066cc;
      text-decoration: none;
    }

    .error-wrapper a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="error-wrapper">
  <div class="error-code">404</div>
  <div class="error-title">戻ることができると思っているのですか？</div>

  <div class="error-text">
    指定されたページは存在しません、<br>
    あなたは逃げれません。
  </div>

  <a href="Null3.html">トップページへ戻ることはできません</a>
</div>

</body>
</html>
